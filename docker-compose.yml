services:
  postgres:
    image: postgres:16
    container_name: ai_interview_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview
    ports:
      - '5432:5432'
    volumes:
      - ai_interview_pgdata:/var/lib/postgresql/data

volumes:
  ai_interview_pgdata:
